<!DOCTYPE html>
<html lang="en">

<head>
	<title></title>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<style>
		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			padding: 0;
		}

		a[x-apple-data-detectors] {
			color: inherit !important;
			text-decoration: inherit !important;
		}

		#MessageViewBody a {
			color: inherit;
			text-decoration: none;
		}

		p {
			line-height: inherit
		}

		.image_block img+div {
			display: none;
		}

		@media (max-width:620px) {
			.row-content {
				width: 100% !important;
			}

			.stack .column {
				width: 100%;
				display: block;
			}

			.row-2 .column-1 {
				padding: 48px 20px !important;
			}

			.row-3 .column-1 {
				padding: 5px 24px !important;
			}

			.row-2 .column-1 .block-2.heading_block h1 {
				font-size: 36px !important;
			}

			.row-3 .column-1 .block-1.heading_block h3 {
				text-align: center !important;
			}

			.row-3 .column-1 .block-2.paragraph_block td.pad>div {
				text-align: center !important;
				font-size: 14px !important;
			}
		}
	</style>
</head>

<body class="body" style="margin: 0; background-color: #172333; padding: 0; -webkit-text-size-adjust: none; text-size-adjust: none;">
	<table class="nl-container" width="100%" border="0" cellpadding="0" cellspacing="0" role="presentation" style="mso-table-lspace: 0pt; mso-table-rspace: 0pt; background-color: #172333;">
		<tbody>
			<tr>
				<td>
					<!-- Gold accent bar -->
					<table class="row row-1" align="center" width="100%" border="0" cellpadding="0" cellspacing="0" role="presentation" style="mso-table-lspace: 0pt; mso-table-rspace: 0pt; background-color: #172333;">
						<tbody>
							<tr>
								<td>
									<table class="row-content stack" align="center" border="0" cellpadding="0" cellspacing="0" role="presentation" style="mso-table-lspace: 0pt; mso-table-rspace: 0pt; border-top: 4px solid #98805b; color: #000000; width: 600px; margin: 0 auto;" width="600">
									</table>
								</td>
							</tr>
						</tbody>
					</table>

					<!-- Logo + heading + summary -->
					<table class="row row-2" align="center" width="100%" border="0" cellpadding="0" cellspacing="0" role="presentation" style="mso-table-lspace: 0pt; mso-table-rspace: 0pt; background-color: #172333;">
						<tbody>
							<tr>
								<td>
									<table class="row-content stack" align="center" border="0" cellpadding="0" cellspacing="0" role="presentation" style="mso-table-lspace: 0pt; mso-table-rspace: 0pt; background-color: #172333; color: #000000; width: 600px; margin: 0 auto;" width="600">
										<tbody>
											<tr>
												<td class="column column-1" width="100%" style="mso-table-lspace: 0pt; mso-table-rspace: 0pt; font-weight: 400; text-align: left; padding-bottom: 48px; padding-left: 50px; padding-right: 50px; padding-top: 38px; vertical-align: top;">
													<table class="image_block block-1" width="100%" border="0" cellpadding="0" cellspacing="0" role="presentation" style="mso-table-lspace: 0pt; mso-table-rspace: 0pt;">
														<tr>
															<td class="pad" style="width:100%;padding-right:0px;padding-left:0px;">
																<div class="alignment" align="center">
																	<div style="max-width: 145px;"><img src="https://sunrise-eng.com/wp-content/themes/sunrise-eng-2018/assets/img/logo-sunrise-color.svg" style="display: block; height: auto; border: 0; width: 100%;" width="145" alt="Sunrise Engineering" height="auto"></div>
																</div>
															</td>
														</tr>
													</table>
													<table class="heading_block block-2" width="100%" border="0" cellpadding="0" cellspacing="0" role="presentation" style="mso-table-lspace: 0pt; mso-table-rspace: 0pt;">
														<tr>
															<td class="pad" style="text-align:center;width:100%;padding-top:16px;">
																<h1 style="margin: 0; color: #ffffff; direction: ltr; font-family: 'Segoe UI', Arial, sans-serif; font-size: 45px; font-weight: 400; letter-spacing: normal; line-height: 1.2; text-align: center; margin-top: 0; margin-bottom: 0;">Project Uploaded</h1>
															</td>
														</tr>
													</table>
													<table class="paragraph_block block-3" width="100%" border="0" cellpadding="0" cellspacing="0" role="presentation" style="mso-table-lspace: 0pt; mso-table-rspace: 0pt; word-break: break-word;">
														<tr>
															<td class="pad" style="padding-bottom:20px;padding-top:20px;">
																<div style="color:#b9bdc2;direction:ltr;font-family:'Segoe UI', Arial, sans-serif;font-size:14px;font-weight:400;letter-spacing:0px;line-height:1.8;text-align:center;">
																	<p style="margin: 0;">{{EMPLOYEE}} has finished uploading <strong>{{PROJECT_NAME}}</strong> for {{CLIENT_NAME}} ({{OFFICE_NAME}}) at {{UPLOAD_TIME}}</p>
																</div>
															</td>
														</tr>
													</table>
												</td>
											</tr>
										</tbody>
									</table>
								</td>
							</tr>
						</tbody>
					</table>

					<!-- Divider -->
					<table align="center" width="100%" border="0" cellpadding="0" cellspacing="0" role="presentation" style="mso-table-lspace: 0pt; mso-table-rspace: 0pt; background-color: #172333;">
						<tbody>
							<tr>
								<td>
									<table align="center" border="0" cellpadding="0" cellspacing="0" role="presentation" style="mso-table-lspace: 0pt; mso-table-rspace: 0pt; width: 600px; margin: 0 auto;" width="600">
										<tbody>
											<tr>
												<td style="padding: 0 50px;">
													<hr style="border: none; border-top: 1px solid #98805b; margin: 0;">
												</td>
											</tr>
										</tbody>
									</table>
								</td>
							</tr>
						</tbody>
					</table>

					<!-- Links section -->
					<table class="row row-3" align="center" width="100%" border="0" cellpadding="0" cellspacing="0" role="presentation" style="mso-table-lspace: 0pt; mso-table-rspace: 0pt; background-color: #172333;">
						<tbody>
							<tr>
								<td>
									<table class="row-content stack" align="center" border="0" cellpadding="0" cellspacing="0" role="presentation" style="mso-table-lspace: 0pt; mso-table-rspace: 0pt; background-color: #172333; color: #000000; width: 600px; margin: 0 auto;" width="600">
										<tbody>
											<tr>
												<td class="column column-1" width="100%" style="mso-table-lspace: 0pt; mso-table-rspace: 0pt; font-weight: 400; text-align: left; padding: 24px 50px; vertical-align: top;">

													<!-- Landing page button -->
													<table width="100%" border="0" cellpadding="0" cellspacing="0" role="presentation" style="mso-table-lspace: 0pt; mso-table-rspace: 0pt;">
														<tr>
															<td align="center" style="padding-bottom:24px;padding-top:8px;">
																<a href="{{LANDING_URL}}" target="_blank" style="display:inline-block;background-color:#98805b;color:#ffffff;font-family:'Segoe UI', Arial, sans-serif;font-size:16px;font-weight:600;text-decoration:none;padding:12px 32px;border-radius:4px;">View Project Landing Page</a>
															</td>
														</tr>
													</table>

													<!-- Downloads heading -->
													<table class="heading_block block-1" width="100%" border="0" cellpadding="0" cellspacing="0" role="presentation" style="mso-table-lspace: 0pt; mso-table-rspace: 0pt;">
														<tr>
															<td class="pad" style="padding-bottom:12px;text-align:center;width:100%;">
																<h3 style="margin: 0; color: #ffffff; direction: ltr; font-family: 'Segoe UI', Arial, sans-serif; font-size: 20px; font-weight: 400; line-height: 1.2; text-align: center;">Downloads</h3>
															</td>
														</tr>
													</table>

													<!-- Download links -->
													<table class="paragraph_block block-2" width="100%" border="0" cellpadding="0" cellspacing="0" role="presentation" style="mso-table-lspace: 0pt; mso-table-rspace: 0pt; word-break: break-word;">
														<tr>
															<td class="pad" style="padding-bottom:20px;">
																<div style="color:#b9bdc2;direction:ltr;font-family:'Segoe UI', Arial, sans-serif;font-size:14px;font-weight:400;line-height:2.0;text-align:center;">
																	{{DOWNLOAD_LINKS}}
																</div>
															</td>
														</tr>
													</table>
												</td>
											</tr>
										</tbody>
									</table>
								</td>
							</tr>
						</tbody>
					</table>

					<!-- Bottom spacer -->
					<table align="center" width="100%" border="0" cellpadding="0" cellspacing="0" role="presentation" style="mso-table-lspace: 0pt; mso-table-rspace: 0pt; background-color: #172333;">
						<tbody>
							<tr>
								<td>
									<table align="center" border="0" cellpadding="0" cellspacing="0" role="presentation" style="mso-table-lspace: 0pt; mso-table-rspace: 0pt; background-color: #172333; width: 600px; margin: 0 auto;" width="600">
										<tbody>
											<tr>
												<td style="height:24px;line-height:24px;font-size:1px;">&#8202;</td>
											</tr>
										</tbody>
									</table>
								</td>
							</tr>
						</tbody>
					</table>

				</td>
			</tr>
		</tbody>
	</table>
</body>

</html>
